name: Dependency-Check

# OWASP Dependency-Check against the runtime classpath of the
# application. Fails the build on any CVE with CVSS ≥ 7.0 that
# isn't suppressed in config/dependency-check/suppression.xml.
#
# Runs weekly (Monday 06:00 UTC) so the NVD database stays current,
# and on workflow_dispatch for ad-hoc audits.  NOT wired to PR builds
# because the NVD download is slow (5–15 min) and a PR shouldn't
# fail because an unrelated CVE dropped overnight. Requires the
# NVD_API_KEY repo secret; unauthenticated NVD API updates can be
# rate-limited.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.1.0

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --stacktrace

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.35.4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: dependency-check

      - name: Upload HTML / JSON reports as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-check-reports
          path: |
            build/reports/dependency-check-report.html
            build/reports/dependency-check-report.json
