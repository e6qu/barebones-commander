name: Tests

on: [pull_request, workflow_dispatch]

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --stacktrace

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
      - name: Build fat JAR and SBOM
        run: ./gradlew fatJar :cyclonedxDirectBom --stacktrace

      - name: Verify package smoke artifacts
        run: |
          test -s build/libs/*-all.jar
          test -s build/reports/bom.json
          test -s build/reports/bom.xml

  # SECURITY_REVIEW.md §5.1: prevent the OSGi-era TLS bypass from
  # ever sneaking back in. The HTTP bundle that called
  # HttpsURLConnection.setDefaultSSLSocketFactory(<permissive>)
  # was deleted in Phase 1; this gate stops any new code from
  # silently downgrading TLS again.
  no-tls-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid HttpsURLConnection.setDefault* in source tree
        run: |
          set -e
          if grep -rn "setDefaultSSLSocketFactory\|setDefaultHostnameVerifier" \
              --include='*.java' --exclude-dir='.git' --exclude-dir='build' .; then
            echo
            echo "ERROR: The lines above install a JVM-wide TLS bypass."
            echo "       See SECURITY_REVIEW.md §5.1 for the original incident."
            exit 1
          fi
          echo "OK — no global TLS-bypass calls in the source tree."

  # actions/dependency-review-action@v4 needs GitHub's "Dependency Graph"
  # feature enabled at the repo level (Settings → Code security and
  # analysis). It's not enabled on forks by default; once the user toggles
  # it on, this job can be uncommented.
