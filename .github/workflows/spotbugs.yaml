name: SpotBugs

# SpotBugs + FindSecBugs static analysis. Runs on every PR and push
# to main. Fails the build on any HIGH-confidence finding not listed
# in config/spotbugs/exclude.xml (the Phase-9 baseline). SARIF output
# is uploaded to GitHub Code Scanning so findings are visible in the
# Security tab.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (toolchain target)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/wrapper-validation-action@v2
      - uses: gradle/actions/setup-gradle@v3

      - name: SpotBugs + FindSecBugs
        run: ./gradlew spotbugsMain --stacktrace

      - name: Stage SARIF reports for upload
        if: always()
        run: |
          set -euo pipefail
          # Stage outside the project tree to avoid the find→cp loop
          # that would recurse into the destination directory.
          STAGE="$RUNNER_TEMP/spotbugs-sarif"
          mkdir -p "$STAGE"
          while IFS= read -r -d '' f; do
            mod=$(echo "$f" | sed -E 's|^\./([^/]+)/.*|\1|')
            cp "$f" "$STAGE/${mod}.sarif"
          done < <(find . -path '*/build/reports/spotbugs/main.sarif' -size +0 -print0)
          ls -la "$STAGE"

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/spotbugs-sarif
          category: spotbugs
